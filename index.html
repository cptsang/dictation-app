<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>默書小幫手</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col max-w-md mx-auto">
  <header class="bg-green-500 text-white text-center py-4 rounded-xl shadow-md mb-4 mt-2">
    <h1 class="text-2xl font-bold">📝 默書小幫手</h1>
  </header>

  <div class="flex-grow flex flex-col gap-4">
    <textarea id="textInput" class="w-full h-40 p-4 border-2 border-gray-300 rounded-xl focus:border-green-500 focus:outline-none resize-none" placeholder="請喺度貼上默書內容..."></textarea>

    <div class="bg-white p-4 rounded-xl shadow-md flex justify-between items-center">
      <label class="text-gray-700 font-bold">語速</label>
      <input type="range" id="rateInput" min="0.3" max="1.2" value="0.7" step="0.1" class="w-2/3 accent-green-500">
    </div>

    <div class="text-center font-bold text-green-700 text-lg min-h-[30px]" id="currentSentenceDisplay">
      準備好就可以開始！
    </div>

    <div class="grid grid-cols-4 gap-2 mt-auto pb-6">
      <button onclick="prev()" class="bg-gray-200 active:bg-gray-300 text-2xl py-4 rounded-xl shadow flex items-center justify-center">⏮️</button>
      <button onclick="repeat()" class="bg-blue-100 active:bg-blue-200 text-2xl py-4 rounded-xl shadow flex items-center justify-center">🔄</button>
      <button onclick="togglePlay()" id="playBtn" class="bg-green-500 active:bg-green-600 text-white text-2xl py-4 rounded-xl shadow flex items-center justify-center">▶️</button>
      <button onclick="next()" class="bg-gray-200 active:bg-gray-300 text-2xl py-4 rounded-xl shadow flex items-center justify-center">⏭️</button>
    </div>
  </div>

  <script>
    let sentences = [];
    let currentIndex = 0;
    let isPlaying = false;
    let utterance = null;
    let synth = window.speechSynthesis;

    function splitText() {
      const text = document.getElementById('textInput').value;
      sentences = text.replace(/([。！？；\n.,!?;]+)/g, "$1|").split("|").map(s => s.trim()).filter(s => s.length > 0);
    }

    function speakSentence(index) {
      if (sentences.length === 0 || index < 0 || index >= sentences.length) return;
      synth.cancel();
      
      utterance = new SpeechSynthesisUtterance(sentences[index]);
      utterance.rate = document.getElementById('rateInput').value;
      utterance.lang = 'zh-HK'; 
      
      document.getElementById('currentSentenceDisplay').innerText = sentences[index];
      
      utterance.onend = function() {
        isPlaying = false;
        updatePlayBtn();
      };

      synth.speak(utterance);
      isPlaying = true;
      updatePlayBtn();
    }

    function togglePlay() {
      if (isPlaying) {
        synth.cancel();
        isPlaying = false;
        updatePlayBtn();
      } else {
        if (sentences.length === 0) {
          splitText();
          currentIndex = 0;
        }
        if (sentences.length > 0) {
          speakSentence(currentIndex);
        }
      }
    }

    function prev() { if (currentIndex > 0) { currentIndex--; speakSentence(currentIndex); } }
    function next() { if (currentIndex < sentences.length - 1) { currentIndex++; speakSentence(currentIndex); } }
    function repeat() { if (sentences.length > 0) { speakSentence(currentIndex); } }

    function updatePlayBtn() {
      document.getElementById('playBtn').innerText = isPlaying ? "⏸️" : "▶️";
    }
  </script>
</body>
</html>
